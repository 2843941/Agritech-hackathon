# Sync this fork with the upstream repo (2843941/Agritech-hackathon).
#
# Why: Render deploys from this fork (Bnaele/Agritech-hackathon), but all
# our teammates push to the original repo. Without this workflow, we'd have
# to click "Sync fork" on GitHub every time we want to redeploy.
#
# How it works:
#   - Runs on a schedule (every 30 minutes) AND on manual trigger.
#   - Pulls the latest `main` from upstream.
#   - Pushes it back to this fork's `main`.
#   - Render sees the push and auto-redeploys.
#
# The FORK_SYNC_TOKEN secret must have `Contents: Read and write` on this
# fork. It was created under Settings -> Secrets and variables -> Actions.

name: Sync fork with upstream

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # also runnable on-demand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/2843941/Agritech-hackathon.git

      - name: Fetch upstream
        run: |
          git fetch upstream main

      - name: Merge upstream into fork main
        run: |
          git checkout main
          git merge upstream/main --ff-only || echo "Already up to date"

      - name: Push to fork
        run: |
          git push origin main
